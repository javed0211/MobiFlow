appId: com.wdiodemoapp
name: E2E API hooks + WDIO Native Demo login
env:
  API_BASE: https://reqres.in
  USER_NAME: MobiFlow E2E
  LOGIN_EMAIL: bob@example.com
  LOGIN_PASSWORD: s3cret
onFlowStart:
  - runScript: scripts/e2e_seed.js
onFlowComplete:
  - runScript: scripts/e2e_teardown.js
---
- launchApp
- assertVisible: "Login|Forms|Home|Webview|Swipe"
- tapOn: "Login"
- tapOn:
    id: "input-email"
    optional: true
- inputText: ${LOGIN_EMAIL}
- tapOn:
    id: "input-password"
    optional: true
- inputText: ${LOGIN_PASSWORD}
- hideKeyboard
- tapOn: "LOGIN"
- assertVisible: "Success|Secret Area|You are logged in|Logout"
- tapOn:
    text: "OK|Logout"
    optional: true
- stopApp
