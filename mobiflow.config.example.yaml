# mobiflow.config.yaml — pick models from llm.json
#
#   cp mobiflow.config.example.yaml mobiflow.config.yaml
#   cp llm.json.example llm.json
#
# Secrets stay in env vars (never paste API keys here).

project:
  mode: local
  path: .

llm:
  catalog: llm.json
  discovery: openai-gpt4o      # adaptive explore / plan on device
  codegen: openai-gpt4o        # Maestro YAML authoring — can differ from discovery

stack:
  tool: maestro
  language: yaml+js            # yaml | yaml+js (Maestro GraalJS: evalScript / runScript)
  runner: maestro
  flow_dir: flows
  scripts_dir: flows/scripts   # companion .js files
  cases_dir: cases

device:
  provider: local              # local | browserstack | testmu
  platform: android
  app_id: ""                   # e.g. org.wikipedia — or set per case
  device_id: ""                # local: adb serial | AVD | UDID
                               # browserstack: "Google Pixel 7-13.0"
                               # testmu: "Pixel 6-14"
  auto_start: true             # local only — start AVD / Xcode sim if none online
  boot_timeout_s: 120
  # --- Cloud device labs (BrowserStack / TestMu) ---
  app_path: ""                 # path to .apk / .ipa to upload
  app_url: ""                  # or existing bs://… / lt://… (skip upload)
  cloud_project: MobiFlow
  cloud_build_name: ""
  real_mobile: true            # testmu: real device vs virtual
  username_env: ""             # optional; defaults:
                               #   browserstack → BROWSERSTACK_USERNAME
                               #   testmu → TESTMU_USERNAME (or LT_USERNAME)
  access_key_env: ""           # BROWSERSTACK_ACCESS_KEY / TESTMU_ACCESS_KEY / LT_ACCESS_KEY
  cloud_timeout_s: 1800

run:
  heal: 2                      # YAML repair attempts (0 = off)
  adaptive: true               # use view hierarchy when device is live (local)
  timeout_s: 180
  save_artifacts: true
